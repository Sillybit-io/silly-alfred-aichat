name: CI

on:
  push:
  pull_request:

# Actions are pinned to commit SHAs (the comment names the release), so a moved tag cannot change what runs.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ".bun-version"
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high
      - run: bun run check
      - run: bun test
      - run: bun run build
      - run: bun run plist
      - name: Fail when the committed Workflow files are stale
        run: git diff --exit-code -- Workflow
      - run: bun run package
