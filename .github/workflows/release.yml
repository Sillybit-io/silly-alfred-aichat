name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - run: bun run build
      - run: bun run plist
      - name: Fail when the committed Workflow files are stale
        run: git diff --exit-code -- Workflow
      - run: bun run package
      - name: Check the tag, versions, and changelog
        run: bun run release:check "$GITHUB_REF_NAME" --no-qa

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"
      - run: bun install --frozen-lockfile
      - run: bun run package
      - name: Rebuild the release notes and check them again
        run: bun run release:check "$GITHUB_REF_NAME" --no-qa
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/AI-Chat.alfredworkflow --verify-tag --notes-file dist/notes.md
